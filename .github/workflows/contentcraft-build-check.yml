name: ContentCraft build verification
run-name: ContentCraft safety tests and production build

on:
  push:
    branches:
      - test/contentcraft-build-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Run AI gateway safety tests
        run: node --test tests/ai-gateway.test.mjs

      - name: Locate and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 3 -type f -iname '*contentcraft*.zip' -print -quit)"
          if [ -z "$ARCHIVE" ]; then
            echo "::error::Could not find a ContentCraft ZIP archive in the repository."
            exit 1
          fi
          echo "Using source archive: $ARCHIVE"
          mkdir -p "$RUNNER_TEMP/contentcraft-src"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/contentcraft-src"
          PACKAGE_JSON="$(find "$RUNNER_TEMP/contentcraft-src" -type f -name package.json -not -path '*/node_modules/*' -print -quit)"
          if [ -z "$PACKAGE_JSON" ]; then
            echo "::error::The archive does not contain package.json."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"
          node -e "const p=require(process.argv[1]); console.log('Scripts:', JSON.stringify(p.scripts || {}))" "$PACKAGE_JSON"

      - name: Ensure global stylesheet exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$PROJECT_DIR/index.css" ]; then
            cp "$GITHUB_WORKSPACE/index.css" "$PROJECT_DIR/index.css"
            echo "Added repository fallback index.css to extracted source archive."
          else
            echo "Source archive already contains index.css."
          fi
          test -s "$PROJECT_DIR/index.css"

      - name: Apply safe runtime patches to extracted archive
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/.github/patches/contentcraft/services/geminiService.ts" "$PROJECT_DIR/services/geminiService.ts"
          cp "$GITHUB_WORKSPACE/.github/patches/contentcraft/services/firebase.ts" "$PROJECT_DIR/services/firebase.ts"
          cp "$GITHUB_WORKSPACE/.github/patches/contentcraft/vite.config.ts" "$PROJECT_DIR/vite.config.ts"
          if grep -R -nE "process\\.env\\.(API_KEY|GEMINI_API_KEY)|new GoogleGenAI" "$PROJECT_DIR" --include='*.ts' --include='*.tsx' --include='*.js' --exclude-dir=node_modules; then
            echo "::error::Unsafe direct Gemini credential usage remains in browser source."
            exit 1
          fi
          grep -q 'fetch("/api/ai"' "$PROJECT_DIR/services/geminiService.ts"
          grep -q 'VITE_FIREBASE_API_KEY' "$PROJECT_DIR/services/firebase.ts"
          echo "Applied patches; direct browser-side Gemini credentials check passed."

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Run production build
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Upload build output for inspection (no deployment)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: contentcraft-production-build
          path: ${{ env.PROJECT_DIR }}/dist/
          if-no-files-found: error
          retention-days: 7
